{% extends "base.html" %}

{% block title %}Add New Book - KitabGhar{% endblock %}

{% block content %}
<div class="container my-5 book-form-container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card book-form-card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="fas fa-plus-circle me-2"></i>Add a New Book</h4>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="{{ url_for('main.add_book') }}" enctype="multipart/form-data">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <!-- Section 1: Core Book Details -->
                        <h5 class="form-section-heading">Book Details</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="title" class="form-label">Title*</label>
                                <input type="text" class="form-control" id="title" name="title" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="author" class="form-label">Author*</label>
                                <input type="text" class="form-control" id="author" name="author" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="5"></textarea>
                        </div>

                        <!-- Section 2: Classification -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label">Category*</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="" selected disabled>Select a Category</option>
                                    <optgroup label="Fiction">
                                        <option value="Adventure">Adventure</option>
                                        <option value="Classic">Classic</option>
                                        <option value="Fantasy">Fantasy</option>
                                        <option value="Historical Fiction">Historical Fiction</option>
                                        <option value="Horror">Horror</option>
                                        <option value="Mystery">Mystery</option>
                                        <option value="Romance">Romance</option>
                                        <option value="Science Fiction">Science Fiction</option>
                                        <option value="Thriller">Thriller</option>
                                    </optgroup>
                                    <optgroup label="Non-Fiction">
                                        <option value="Biography">Biography & Autobiography</option>
                                        <option value="Business">Business & Economics</option>
                                        <option value="Computer Science">Computer Science</option>
                                        <option value="Education">Education</option>
                                        <option value="Health">Health & Fitness</option>
                                        <option value="History">History</option>
                                        <option value="Law">Law</option>
                                        <option value="Politics">Politics & Government</option>
                                        <option value="Psychology">Psychology</option>
                                        <option value="Science">Science</option>
                                        <option value="Self-Help">Self-Help</option>
                                        <option value="Technology">Technology</option>
                                        <option value="Travel">Travel</option>
                                    </optgroup>
                                    <optgroup label="Poetry">
                                        <option value="English Poetry">English Poetry</option>
                                        <option value="Bengali Poetry">Bengali Poetry</option>
                                    </optgroup>
                                    <!-- ============================================================================== -->
                                    <!-- =========================== START: NEW CATEGORY ============================ -->
                                    <!-- ============================================================================== -->
                                    <optgroup label="Spiritual & Philosophy">
                                        <option value="Spiritual">Spiritual</option>
                                        <option value="Philosophy">Philosophy</option>
                                    </optgroup>
                                    <!-- ============================ END: NEW CATEGORY ============================= -->
                                </select>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="genre" class="form-label">Genre</label>
                                <input type="text" class="form-control" id="genre" name="genre" placeholder="e.g., Young Adult, Dystopian">
                            </div>
                        </div>

                        <!-- Section 3: Publication Info -->
                        <div class="row">
                             <div class="col-md-4 mb-3">
                                <label for="publication_year" class="form-label">Publication Year</label>
                                <input type="number" class="form-control" id="publication_year" name="publication_year" min="1000" max="{{ max_year }}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="isbn" class="form-label">ISBN</label>
                                <input type="text" class="form-control" id="isbn" name="isbn">
                            </div>
                             <div class="col-md-4 mb-4">
                                <label for="total_copies" class="form-label">Total Copies*</label>
                                <input type="number" class="form-control" id="total_copies" name="total_copies" min="1" value="1" required>
                            </div>
                        </div>

                        <hr class="my-4">

                        <!-- Section 4: File Uploads -->
                        <h5 class="form-section-heading">Files</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cover_image" class="form-label">Cover Image (JPG, PNG)*</label>
                                <input class="form-control" type="file" id="cover_image" name="cover_image" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="pdf_file" class="form-label">Book PDF (Optional)</label>
                                <input class="form-control" type="file" id="pdf_file" name="pdf_file">
                            </div>
                        </div>
                        
                        <!-- Form Actions -->
                        <div class="d-flex justify-content-end mt-4">
                            <a href="{{ url_for('main.publisher_dashboard') }}" class="btn btn-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Add Book</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
